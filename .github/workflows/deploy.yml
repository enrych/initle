name: Deploy

# Production deploys on every push to main. "Run workflow" in the Actions tab deploys any branch
# on demand (handy for trying a branch before merging).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Typecheck and unit tests
        run: pnpm typecheck && pnpm --filter @initle/core test

      - name: Ensure D1 database
        run: node scripts/ensure-d1.mjs initle

      - name: Build web app
        run: pnpm build

      - name: Apply database migrations
        working-directory: apps/server
        run: npx wrangler d1 migrations apply initle --remote

      - name: Deploy Worker
        id: deploy
        working-directory: apps/server
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify live site
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::No workers.dev URL found in the deploy output (custom domain only?)"; exit 0; fi
          for i in $(seq 1 20); do curl -sf "$URL/api/health" && break; sleep 3; done
          curl -sf "$URL/api/health" > /dev/null
          curl -sf "$URL/" | grep -q "<div id=\"root\">"
          echo "### 🎉 Live at $URL" >> "$GITHUB_STEP_SUMMARY"
